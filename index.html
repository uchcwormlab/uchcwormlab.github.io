<!DOCTYPE html>
<html>
<head>
  <title>Niu family</title>
  <link rel="icon" type="image/png" href="celegan.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column; 
      justify-content: flex-start;
      align-items: center;

      background: #f4f4f4;
      font-family: Arial, sans-serif;
      padding-top: 80px; 
    }

    /* Top navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      background: #222;
      padding: 10px 0;

      display: flex;
      justify-content: center;
      gap: 20px;

      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    nav button {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.3s;
    }

    nav button:hover, nav button.active {
      background: #007bff;
    }

    /* Content Sections Styling */
    .content-section {
      display: none; 
      width: 90%;
      max-width: 900px; /* Widened slightly to accommodate the grid comfortably */
      margin: 20px 0;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .content-section.active {
      display: block; 
    }

    /* Grid container */
    .button-group {
      display: grid;
      /* 5 columns */
      grid-template-columns: repeat(5, 150px);
      gap: 20px;
      margin-top: 30px;
      justify-content: center; /* Centers the grid columns inside the Home section */
    }

    /* Button style */
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;
      border: 1px solid black;

      height: 40px;

      color: black;
      text-decoration: none;

      border-radius: 10px;

      font-size: 18px;

      transition: 0.3s;
    }

    .btn:hover {
      background: #0056b3;
      color: white;
    }
  </style>
</head>

<body>

  <nav>
    <button onclick="showSection('home')" id="btn-home" class="active">Home</button>
    <button onclick="showSection('work')">Work</button>
    <button onclick="showSection('family')">Family</button>
    <button onclick="showSection('code')">Code</button>
    <button onclick="showSection('tailscale')">TailScale</button>
  </nav>

  <div id="home" class="content-section active">
    <div class="button-group">
      <a href="https://10.133.119.219/wormui.html" target="_blank" class="btn">WormStrains</a>
      <a href="https://10.133.119.219/plasmidui.html" target="_blank" class="btn">Plasmid</a>
      <a href="https://10.133.119.219/oligoui.php" target="_blank" class="btn">Oligo</a>
      <a href="https://10.133.119.219/chemicalui.php" target="_blank" class="btn">Chemicals</a>

    </div>
  </div>
  <div id="work" class="content-section">
     <div class="button-group">
      <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" class="btn">PubMed</a>  

     </div>

  </div>

  <div id="family" class="content-section">

      <div class="button-group">
        <a href="https://docs.google.com/spreadsheets/d/1b9Y2Ebfqopx2BYCn2fh_gkMLYCk1Q8gxHxFIDN1mzTk/edit#gid=0" target="_blank" class="btn">SCN Data</a>
        <a href="https://docs.google.com/spreadsheets/d/1PbKGWGysGvVI1scb24zX6GhzAKc_Nz0kylr3DdKAIe4/edit#gid=525325114" target="_blank" class="btn">Worm Data</a>
        <a href="http://10.133.255.242/lablogui.php" target="_blank" class="btn">WormLab Log</a>        
      </div>
  </div>
  <div id="code" class="content-section">
      <div class="button-group">
        <a href="https://10.133.119.219/paperweb.html" target="_blank" class="btn">PaperWeb</a>
        <a href="https://10.133.119.219/pdfNew.php" target="_blank" class="btn">PDF Manager</a>
        <a href="https://10.133.119.219/filemanager/filemanager.html" target="_blank" class="btn">File Manager</a>
        <a href="http://10.133.119.219:8081/" target="_blank" class="btn">Trilium Note</a>
        <a href="https://10.133.119.219/nextcloud/index.php/apps/files/files" target="_blank" class="btn">NextCloud</a>        
      </div>
  </div>

    <div id="tailscale" class="content-section">
    <div class="button-group">
      <a href="http://100.108.89.26/wormui.html" target="_blank" class="btn">WormStrains</a>

      

    </div>
  </div>

  <script>
    function showSection(sectionId) {
      const sections = document.querySelectorAll('.content-section');
      sections.forEach(section => {
        section.classList.remove('active');
      });

      const navButtons = document.querySelectorAll('nav button');
      navButtons.forEach(button => {
        button.classList.remove('active');
      });

      document.getElementById(sectionId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
